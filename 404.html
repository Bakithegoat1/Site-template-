<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found</title>
<meta name="description" content="The page you're looking for doesn't exist or may have moved.">
<meta name="robots" content="noindex">
<link rel="icon" id="favicon-link" href="images/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" id="apple-touch-icon-link" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="page-404">

<a href="#content" class="skip-link">Skip to main content</a>

<!-- Minimal header: no in-page nav links here (this page has none of the
     section anchors they'd point to) — just the brand, linking home. -->
<header class="site-header" id="site-header">
  <div class="container header-inner">
    <a href="index.html" class="brand" id="brand-logo">
      <span class="brand-mark" id="brand-mark"></span>
      <span class="brand-name" id="brand-name"></span>
    </a>
  </div>
</header>

<main id="content">
  <section class="section notfound-section">
    <div class="container notfound-inner">
      <p class="eyebrow" id="notfound-eyebrow">404</p>
      <h1>Page Not Found</h1>
      <p class="section-sub">The page you're looking for doesn't exist or may have moved.</p>
      <a href="index.html" class="btn btn-accent btn-lg">Back to Home</a>
    </div>
  </section>
</main>

<!-- ============================= FOOTER =============================
     Quick Links is omitted here too, same reason as the header nav. -->
<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <span class="brand-mark" id="footer-brand-mark"></span>
      <span class="brand-name" id="footer-brand-name"></span>
      <p id="footer-tagline"></p>
      <p id="footer-service-areas" class="footer-service-areas" hidden></p>
      <div class="social-links" id="footer-social-links"></div>
    </div>

    <div class="footer-col">
      <h3 id="footer-contact-heading"></h3>
      <ul id="footer-contact-list"></ul>
    </div>

    <div class="footer-col">
      <h3 id="footer-hours-heading"></h3>
      <ul id="footer-hours-list"></ul>
    </div>
  </div>
  <div class="footer-bottom">
    <div class="container footer-bottom-inner">
      <p id="footer-copyright"></p>
      <p id="footer-license"></p>
    </div>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
